
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experience | Troy Chen</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>

<body>

  <!-- Navigation Bar -->
  <header>
    <a href="index.html" class="logo">Tianyi's Portfolio</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a href="resume.html">Resume</a>
      <a href="experience.html" class="active">Experience</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Experience Section -->
  <section class="experience-section" id="experience">

    <h2>My Experience</h2>

    <div class="experience-list">

      <!-- Experience 1: Walter E. Lay -->
      <button
        class="experience-card"
        type="button"
        data-experience="lay"
      >

        <div class="experience-card-text">
          <h3>Walter E. Lay Automotive Laboratory</h3>
          <p>Research Assistant, University of Michigan</p>
          <p class="experience-date">September 2026 - Present</p>
        </div>

        <div class="experience-photo">
          <span>Add Photo</span>
        </div>

      </button>


      <!-- Experience 2: Zoetic Robotics -->
      <button
        class="experience-card"
        type="button"
        data-experience="zoetic"
      >

        <div class="experience-card-text">
          <h3>Zoetic Robotics Laboratory</h3>
          <p>Research Assistant, University of Michigan</p>
          <p class="experience-date">September 2026 - Present</p>
        </div>

        <div class="experience-photo">
          <span>Add Photo</span>
        </div>

      </button>


      <!-- Experience 3: Stellbot -->
      <button
        class="experience-card"
        type="button"
        data-experience="stellbot"
      >

        <div class="experience-card-text">
          <h3>Stellbot (星际智行)</h3>

          <p>
            Mechanical Engineering Intern, Nanjing, China
          </p>

          <p class="experience-date">
            June 2026 – August 2026
          </p>
        </div>

        <div class="experience-photo">
          <span>Add Photo</span>
        </div>

      </button>


      <!-- Experience 4: Michigan State University -->
      <button
        class="experience-card"
        type="button"
        data-experience="spence"
      >

        <div class="experience-card-text">
          <h3>Spence Lab</h3>

          <p>Research Assistant, Michigan State University</p>
          
          <p class="experience-date">
            August 2024 – May 2025
          </p>
        </div>

        <div class="experience-photo">
          <span>Add Photo</span>
        </div>

      </button>

    </div>

  </section>


  <!-- Experience Details Popup -->
  <dialog class="experience-modal" id="experience-modal">

    <button
      class="modal-close"
      type="button"
      aria-label="Close"
    >
      &times;
    </button>

    <h2 id="modal-title"></h2>

    <p id="modal-date" class="modal-date"></p>

    <h3 id="modal-role"></h3>

    <p id="modal-university"></p>

    <p id="modal-description"></p>

  </dialog>


  <!-- Experience Popup JavaScript -->
  <script>

    const experiences = {

      // Walter E. Lay
      lay: {
        title: "Walter E. Lay Automotive Laboratory",
        date: "September 2026 - Present",
        role: "Combustion Engine Efficiency R&D - University of Michigan, Ann Arbor",

        description: `
        I am currently working under Dr. Andre Boehman, my research includes creating a photodiode based sensor to detect light emission inside 
        the engine combustion chamber. I designed the circuit layout and PCB to host 8 photodiodes, processing each of the photodiodes output using
        transimpedance amplifier, and Op-Amp to significantly amplify the signals, then, routing each of the signals to a set of output 
        pinheaders to be analyzed in LabVIEW. In which I am currently working on data collection. 

        I am also working with graduate students in testing exhaust rebreathing to increase the temperature inside a diesel
        combustion engine piston, to try to achieve smooth idling of the engine when 100% ethanol fuel is being used. 
      `
      },


      // Zoetic Robotics
      zoetic: {
        title: "Zoetic Robotics Laboratory",
        date: "September 2026 - Present",
        role: "Controlled Micro-Combustion R&D - University of Michigan, Ann Arbor",

        description: `
          I am currently working under Dr. Cameron Aubin on designing a micro-fuel tank for our insect scale micro-combustion actuators
          my research focus on designing a fuel tank that can host a stable chemical reaction to produce the needed fuel, deliver the 
          produced fuel in a steady controllable way to the fuel tank and also manage the build-up of by-products caused by the reaction.

          I am also working on using controlled combustion as a way to transport signals from point A to B, where sensors at point B 
          picks up the signal and processes it. Similar to that of a circuit, but instead the system is run on explosive waves rather than
          flow of electrons. Our group also achieved some logic gates using this combustion signal design. 
          `
      },


      // Stellbot
      stellbot: {
        title: "Stellbot (星际智行) – Design Research Team",
        date: "June 2026 – August 2026",

        role:
          "Hardware/Structure Design and Testing - Nanjing, China",

        description: `
         This is an internship I did in China in the Summer of 2026 where I worked for a company developing robotic dogs. During the internship I reorganized 
         and converted robotic dog SolidWorks files into a Unified Robot Description Format (URDF) file 
         
         Also, I got to work a lot with EasyEDA, a PCB design software developed by JLCPCB to design lots of circuit boards for our robotic dogs, along 
         with soldering and assembling each component of the circuit board. One of the PCBs I got to design for the company was a plug hub that powered and 
         hosted all 12 of the plugs for each of the motors on the dog’s joints.
         
         I made an app using Python that monitored our robotic dog battery pack’s data, the battery sends out a lot of data to be manually analyzed to check for errors and bugs, 
         so I made the app to display and process all the data automatically, the app recorded any unusual behavior of the battery pack, and also collected data on charging and 
         discharging rates. The final version of the app included a Voltage vs. Battery SOC graphing function as well as 2 display languages to choose from (Chinese or English).
         
         Finally I got a chance to start learning how to code STM32 microcontrollers using the Hardware Abstraction Layer (HAL) library with CubeMX and Keil µVision.

     `
      },


      // Michigan State University - Spence Lab
      spence: {
        title: "Michigan State University – Spence Lab",

        date: "August 2024 – May 2025",

        role:
          "Medical Research with Red Blood Cells- Michigan State University",

        description: `
          I worked under Dr. Dana Spence in researching the effect of C-peptide in glucose transport in patient with type one diabetes, my research included 
          testing the ATP release of red blood cells (RBC) in different blood samples, using a dual pump injection system and measuring bioluminescence release of 
          light when I mix ATP from various blood samples with luciferin luciferase.

          I also worked on blood storage solutions to prolong the storage of blood, testing different coatings in blood storage bags and how often/much we feed 
          the RBCs to keep them from deforming over time and lysising. 
`
      }

    };


    // Find popup
    const modal = document.getElementById("experience-modal");


    // Open popup on card click
    document.querySelectorAll(".experience-card").forEach(card => {

      card.addEventListener("click", () => {

        const experience = experiences[card.dataset.experience];

        if (!experience) return;

        document.getElementById("modal-title").textContent =
          experience.title;

        document.getElementById("modal-date").textContent =
          experience.date;

        document.getElementById("modal-role").textContent =
          experience.role;

        document.getElementById("modal-university").textContent =
          experience.university;

        document.getElementById("modal-description").textContent =
          experience.description;

        modal.showModal();

      });

    });


    // Close popup with X
    document.querySelector(".modal-close").addEventListener("click", () => {
      modal.close();
    });


    // Close popup when clicking outside
    modal.addEventListener("click", event => {

      if (event.target === modal) {
        modal.close();
      }

    });

  </script>


  <!-- Smooth Page Transition -->
  <script src="transition.js"></script>

</body>
</html>
