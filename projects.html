
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Projects | Troy Chen</title>

  <link rel="stylesheet" href="style.css?v=14">
  </head>

<body>

  <!-- Navigation Bar -->
  <header>
    <a href="index.html" class="logo">
      Tianyi's Portfolio
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a href="resume.html">Resume</a>
      <a href="experience.html">Experience</a>
      <a href="projects.html" class="active">Projects</a>
      <a href="contact.html">Contact</a>
      <a href="honors.html">Umich Honors Program</a>

    </nav>
  </header>


  <!-- Projects Section -->
  <main class="page-container">

    <h1>My Projects</h1>

    <div class="cards">

      <!-- Project 1 -->
      <button
        class="card project-card"
        type="button"
        data-project="combustion"
        aria-haspopup="dialog"
      >

        <span class="project-title">
          Micro-Combustion Actuator
        </span>

        <span class="project-summary">
          Research and development of
          micro-combustion systems for
          insect-scale robotic applications.
        </span>

      </button>


      <!-- Project 2 -->
      <button
        class="card project-card"
        type="button"
        data-project="photodiode"
        aria-haspopup="dialog"
      >

        <span class="project-title">
          Photodiode Sensor System
        </span>

        <span class="project-summary">
          Development of photodiode-based
          sensing circuits for optical
          measurements in combustion research.
        </span>

      </button>


      <!-- Project 3 -->
      <button
        class="card project-card"
        type="button"
        data-project="future"
        aria-haspopup="dialog"
      >

        <span class="project-title">
          Future Projects
        </span>

        <span class="project-summary">
          More engineering and research
          projects coming soon.
        </span>

      </button>

    </div>

  </main>


  <!-- Project Popup -->
  <dialog
    class="experience-modal project-modal"
    id="project-modal"
    aria-labelledby="project-modal-title"
  >

    <!-- Close Button -->
    <button
      class="modal-close"
      type="button"
      aria-label="Close project details"
    >
      &times;
    </button>

    <h2 id="project-modal-title"></h2>

    <h3>Project Overview</h3>

    <p id="project-modal-description"></p>

    <h3>Additional Details</h3>

    <p id="project-modal-extra"></p>

  </dialog>


  <!-- Project Popup JavaScript -->
  <script>

    // Information for each project
    const projects = {

      // Micro-Combustion Actuator
      combustion: {
        title: "Micro-Combustion Actuator",

        description:
          "Research and development of micro-combustion systems for insect-scale robotic applications.",

        extra:
          "Exploring fuel generation, fuel delivery, and combustion-based actuation for miniature robotic systems. Additional design information, prototype images, and testing results can be added here."
      },


      // Photodiode Sensor System
      photodiode: {
        title: "Photodiode Sensor System",

        description:
          "Development of photodiode-based sensing circuits for optical measurements in combustion research.",

        extra:
          "Developing electronic sensing systems that convert photodiode current into measurable voltage signals. Circuit diagrams, hardware photographs, and experimental results can be added here."
      },


      // Future Projects
      future: {
        title: "Future Projects",

        description:
          "More engineering and research projects coming soon.",

        extra:
          "Additional mechanical engineering, robotics, and electronics projects will be featured here."
      }

    };


    // Find Popup
    const projectModal =
      document.getElementById("project-modal");


    // Open Popup When Project Is Clicked
    document.querySelectorAll(".project-card").forEach(card => {

      card.addEventListener("click", () => {

        const project = projects[card.dataset.project];

        if (!project) return;

        // Set Project Title
        document.getElementById(
          "project-modal-title"
        ).textContent = project.title;

        // Set Description
        document.getElementById(
          "project-modal-description"
        ).textContent = project.description;

        // Set Additional Details
        document.getElementById(
          "project-modal-extra"
        ).textContent = project.extra;

        // Open Popup With Zoom Animation
        projectModal.showModal();

      });

    });


    // Close Popup Using X Button
    projectModal.querySelector(".modal-close")
      .addEventListener("click", () => {

        projectModal.close();

      });


    // Close Popup When Clicking Outside
    projectModal.addEventListener("click", event => {

      const rect = projectModal.getBoundingClientRect();

      const clickedOutside =
        event.clientX < rect.left ||
        event.clientX > rect.right ||
        event.clientY < rect.top ||
        event.clientY > rect.bottom;

      if (clickedOutside) {
        projectModal.close();
      }

    });

  </script>


  <!-- Smooth Page Transition -->
  <script src="transition.js"></script>

</body>
</html>
