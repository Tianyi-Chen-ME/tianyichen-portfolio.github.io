
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Projects | Tianyi Chen</title>

  <link rel="stylesheet" href="style.css?v=15">

  <style>

    /* =====================================
       PROJECT CARDS
    ===================================== */

    .project-card {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 20px;

      width: 100%;
      height: auto;
      min-height: 0;
      padding: 25px;

      border: none;
      border-radius: 15px;
      background: white;

      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    /* Project Name at Top */

    .project-card .project-title {
      display: block;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      color: #172337;
      margin: 0;
    }

    /* Photo Under Project Name */

    .project-card-image {
      width: 100%;
      aspect-ratio: 4 / 3;

      background: #e9edf2;
      border: 1px solid #dce3eb;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .project-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .project-card-placeholder {
      color: #7b8593;
      font-size: 16px;
      text-align: center;
    }

    /* Caption Below Card Image */

    .project-card-caption {
      display: block;
      font-size: 14px;
      line-height: 1.4;
      color: #526275;
      text-align: center;
      margin-top: -8px;
    }


    /* =====================================
       PROJECT POPUP
    ===================================== */

    .project-modal {
      width: min(1100px, 95vw);
      max-width: 95vw;
      max-height: 85vh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* Text Left - Image Right */

    .project-modal-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 35px;
      align-items: start;
      margin-top: 25px;
    }

    /* Project Details */

    .project-modal-text {
      min-width: 0;
    }

    .project-modal-text h3 {
      font-size: 22px;
      margin: 0 0 20px;
      color: #172337;
    }

    .project-modal-text p {
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 25px;
      color: #536179;
      white-space: pre-line;
    }


    /* =====================================
       SKILLS SECTION
    ===================================== */

    .project-skills {
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid #e0e5eb;
    }

    .project-skills h3 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .project-skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .project-skill-tag {
      display: inline-block;
      padding: 8px 14px;

      background: #e9f2fc;
      color: #0077cc;

      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }


    /* =====================================
       SQUARE IMAGE INSIDE POPUP
    ===================================== */

    .project-modal-image {
      width: 100%;
      aspect-ratio: 1 / 1;

      background: #e9edf2;
      border: 1px solid #dce3eb;
      border-radius: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .project-modal-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .project-modal-placeholder {
      color: #7b8593;
      font-size: 16px;
      text-align: center;
    }

    /* Hide images or placeholders when needed */

    .project-card-image [hidden],
    .project-modal-image [hidden] {
      display: none !important;
    }

    /* Popup Image Caption */

    .project-modal-figure {
      width: 100%;
      min-width: 0;
      margin: 0;
    }

    .project-modal-caption {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      color: #526275;
    }


    /* =====================================
       MOBILE RESPONSIVE
    ===================================== */

    @media (max-width: 700px) {

      .project-card {
        padding: 20px;
      }

      .project-card .project-title {
        font-size: 21px;
      }

      .project-modal {
        padding: 35px 25px;
      }

      .project-modal-layout {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .project-modal-image {
        max-width: 280px;
      }

      .project-modal-text p {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>

  <!-- Navigation Bar -->
  <header>

    <a href="index.html" class="logo">
      Tianyi's Portfolio
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a href="resume.html">Resume</a>
      <a href="experience.html">Experience</a>
      <a href="projects.html" class="active">Projects</a>
      <a href="honors.html">UMich Honors Program</a>
      <a href="contact.html">Contact</a>
    </nav>

  </header>


  <!-- =====================================
       PROJECTS PAGE
  ===================================== -->

  <main class="page-container">

    <h1>My Projects</h1>

    <div class="cards">


      <!-- Project 1 -->
      <button
        class="card project-card"
        type="button"
        data-project="combustion"
        aria-haspopup="dialog"
      >

        <span class="project-title">
          ME 350 Four-Bar Linkage System
        </span>

        <div class="project-card-image">
          <img class="project-card-img" alt="" hidden>

          <span class="project-card-placeholder">
            Image unavailable
          </span>
        </div>

        <span class="project-card-caption"></span>

      </button>


      <!-- Project 2 -->
      <button
        class="card project-card"
        type="button"
        data-project="photodiode"
        aria-haspopup="dialog"
      >

        <span class="project-title">
          Smart Watch
        </span>

        <div class="project-card-image">
          <img class="project-card-img" alt="" hidden>

          <span class="project-card-placeholder">
            Image unavailable
          </span>
        </div>

        <span class="project-card-caption"></span>

      </button>


      <!-- Project 3 -->
      <button
        class="card project-card"
        type="button"
        data-project="newproject"
        aria-haspopup="dialog"
      >

        <span class="project-title">
          PCB Keychains
        </span>

        <div class="project-card-image">
          <img class="project-card-img" alt="" hidden>

          <span class="project-card-placeholder">
            Image unavailable
          </span>
        </div>

        <span class="project-card-caption"></span>

      </button>


      <!-- Project 4 -->
      <button
        class="card project-card"
        type="button"
        data-project="future"
        aria-haspopup="dialog"
      >

        <span class="project-title">
          ME 250 RMP Robot
        </span>

        <div class="project-card-image">
          <img class="project-card-img" alt="" hidden>

          <span class="project-card-placeholder">
            Image unavailable
          </span>
        </div>

        <span class="project-card-caption"></span>

      </button>


    </div>

  </main>


  <!-- =====================================
       PROJECT POPUP
  ===================================== -->

  <dialog
    class="experience-modal project-modal"
    id="project-modal"
    aria-labelledby="project-modal-title"
  >

    <!-- Close Button -->
    <button
      class="modal-close"
      type="button"
      aria-label="Close project details"
    >
      &times;
    </button>


    <!-- Project Title -->
    <h2 id="project-modal-title"></h2>


    <div class="project-modal-layout">


      <!-- LEFT SIDE -->
      <div class="project-modal-text">

        <h3>Project Details</h3>

        <p id="project-modal-description"></p>

        <p id="project-modal-extra"></p>


        <!-- Skills -->
        <section class="project-skills">

          <h3>Skills</h3>

          <div
            class="project-skills-list"
            id="project-modal-skills"
          ></div>

        </section>

      </div>


      <!-- RIGHT SIDE: Image and Caption -->
      <figure class="project-modal-figure">

        <div class="project-modal-image">

          <img
            id="project-modal-image"
            alt=""
            hidden
          >

          <span
            id="project-modal-placeholder"
            class="project-modal-placeholder"
            hidden
          >
            Image unavailable
          </span>

        </div>

        <!-- Image Description Below Picture -->
        <figcaption
          id="project-modal-caption"
          class="project-modal-caption"
        ></figcaption>

      </figure>


    </div>

  </dialog>


  <!-- =====================================
       JAVASCRIPT
  ===================================== -->

  <script>

    const projects = {


      // =====================================
      // PROJECT 1
      // =====================================

      combustion: {

        title: "ME 350 Four-Bar Linkage System",

        summary: `Designed a four-bar linkage system with a flashlight
attached to the end coupler controlled by motor to
shine flashlight on multiple photodiode target, with precision,
The system included a full automated control system powered by
Arduino`,

        skills: [
          "Arduino",
          "Four-Bar Linkages",
          "Automation"
        ],

        // Image shown on project card
        coverImage: "ME350link.jpg",

        // Caption underneath card image
        coverCaption: "Four-bar linkage mechanism",

        // Image shown inside popup
        image: "ME 350 Four-Bar Linkage System.jpg",

        // Caption underneath popup image
        imageCaption: ""

      },


      // =====================================
      // PROJECT 2
      // =====================================

      photodiode: {

        title: "Smart Watch",

        summary: `Designed and built a smart watch
from PCB to soldering, then finally
coding it to operate. Used standard Lithium
drone battery and touch screen smart watch
display, along with 2 prong magnetic charging.`,

        skills: [
          "PCB Design",
          "Soldering",
          "Programming",
          "Electronics"
        ],

        coverImage: "SmartwatchEDAv1.jpg",

        coverCaption: "Smartwatch PCB design",

        image: "SmartwachPCB.jpeg",

        imageCaption: ""

      },


      // =====================================
      // PROJECT 3
      // =====================================

      newproject: {

        title: "PCB Keychains",

        summary: `Made a working Microcontroller keychian using
STM32F4 as the MCU, with all the GPIO pins connected
to pin header slots. (PCB printed unsoldered)`,

        skills: [
          "STM32F4",
          "PCB Design",
          "Microcontrollers",
          "GPIO"
        ],

        coverImage: "KeychainEDA.jpg",

        coverCaption: "PCB keychain layout",

        image: "PCBkeychain.jpeg",

        imageCaption: ""

      },


      // =====================================
      // PROJECT 4
      // =====================================

      future: {

        title: "ME 250 RMP Robot",

        summary: `Designed a robot vehicle with a virtual four-bar claw
system installed on the vehicle, capable of picking up
objects from the ground, while the claw maintained horizontal
position through the whole grab and lift motion.`,

        skills: [
          "Mill",
          "Lathe",
          "Waterjet"
        ],

        coverImage: "ME250RMProbot.jpg",

        coverCaption: "ME 250 RMP robot",

        image: "RMP.jpeg",

        imageCaption: ""

      }

    };


    // =====================================
    // FIND POPUP ELEMENTS
    // =====================================

    const projectModal =
      document.getElementById("project-modal");

    const projectImage =
      document.getElementById("project-modal-image");

    const projectPlaceholder =
      document.getElementById("project-modal-placeholder");

    const skillsContainer =
      document.getElementById("project-modal-skills");


    // =====================================
    // IMAGE LOADING FUNCTION
    // =====================================

    function loadProjectImage(
      imageElement,
      placeholderElement,
      filename,
      title
    ) {

      // Hide image while it loads
      imageElement.hidden = true;

      if (placeholderElement) {
        placeholderElement.hidden = false;
      }

      if (!filename) {
        imageElement.removeAttribute("src");
        return;
      }

      // Show image after successful loading
      imageElement.onload = function() {

        imageElement.hidden = false;

        if (placeholderElement) {
          placeholderElement.hidden = true;
        }

      };

      // Show placeholder if image fails
      imageElement.onerror = function() {

        imageElement.hidden = true;

        if (placeholderElement) {
          placeholderElement.hidden = false;
        }

      };

      imageElement.alt = title;

      imageElement.src = filename;

    }


    // =====================================
    // LOAD PROJECT CARD IMAGES
    // =====================================

    document.querySelectorAll(".project-card").forEach(card => {

      const project = projects[card.dataset.project];

      if (!project) return;

      const image =
        card.querySelector(".project-card-img");

      const placeholder =
        card.querySelector(".project-card-placeholder");

      const caption =
        card.querySelector(".project-card-caption");

      // Each project gets its own caption
      caption.textContent = project.coverCaption;

      loadProjectImage(
        image,
        placeholder,
        project.coverImage,
        project.title
      );

    });


    // =====================================
    // OPEN PROJECT POPUP
    // =====================================

    document.querySelectorAll(".project-card").forEach(card => {

      card.addEventListener("click", () => {

        const project = projects[card.dataset.project];

        if (!project) return;


        // Project Title
        document.getElementById(
          "project-modal-title"
        ).textContent = project.title;


        // Project Description
        document.getElementById(
          "project-modal-description"
        ).textContent = project.summary;


        // Clear unused details
        document.getElementById(
          "project-modal-extra"
        ).textContent = "";


        // =====================================
        // SKILLS
        // =====================================

        skillsContainer.innerHTML = "";

        project.skills.forEach(skill => {

          const tag = document.createElement("span");

          tag.className = "project-skill-tag";

          tag.textContent = skill;

          skillsContainer.appendChild(tag);

        });

        skillsContainer.parentElement.hidden =
          project.skills.length === 0;


        // =====================================
        // POPUP IMAGE CAPTION
        // =====================================

        document.getElementById(
          "project-modal-caption"
        ).textContent = project.imageCaption;


        // =====================================
        // POPUP IMAGE
        // =====================================

        loadProjectImage(
          projectImage,
          projectPlaceholder,
          project.image,
          project.title
        );


        // =====================================
        // SHOW POPUP
        // =====================================

        projectModal.showModal();

      });

    });


    // =====================================
    // CLOSE POPUP WITH X BUTTON
    // =====================================

    projectModal.querySelector(".modal-close")
      .addEventListener("click", () => {

        projectModal.close();

      });


    // =====================================
    // CLOSE POPUP BY CLICKING OUTSIDE
    // =====================================

    projectModal.addEventListener("click", event => {

      const rect = projectModal.getBoundingClientRect();

      const clickedOutside =
        event.clientX < rect.left ||
        event.clientX > rect.right ||
        event.clientY < rect.top ||
        event.clientY > rect.bottom;

      if (clickedOutside) {
        projectModal.close();
      }

    });

  </script>
