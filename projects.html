
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Projects | Troy Chen</title>

  <link rel="stylesheet" href="style.css?v=15">

  <!-- Project Popup Image Styling -->
  <style>

    /* =========================================
       PROJECT POPUP - TEXT AND IMAGE LAYOUT
    ========================================= */

    .project-modal {
      width: min(1100px, 95vw);
      max-width: 95vw;
      max-height: 85vh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* Left Text and Right Image */
    .project-modal-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 35px;
      align-items: start;
      margin-top: 20px;
    }

    /* Left Side Text */
    .project-modal-text {
      min-width: 0;
    }

    .project-modal-text h3 {
      font-size: 21px;
      margin-top: 0;
      margin-bottom: 20px;
      color: #19263b;
    }

    .project-modal-text p {
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 30px;
      color: #536179;
      white-space: pre-line;
    }

    /* =========================================
       SQUARE PROJECT IMAGE
    ========================================= */

    .project-modal-image {
      width: 100%;
      aspect-ratio: 1 / 1;

      background: #e9edf2;
      border: 1px solid #dce3eb;
      border-radius: 15px;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    /* Actual Project Image */
    .project-modal-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Hide Image Until Available */
    .project-modal-image img[hidden],
    .project-modal-image span[hidden] {
      display: none;
    }

    /* Placeholder When Image Is Missing */
    .project-image-placeholder {
      padding: 20px;
      text-align: center;
      color: #7b8593;
      font-size: 16px;
      line-height: 1.5;
    }

    /* =========================================
       MOBILE LAYOUT
    ========================================= */

    @media (max-width: 700px) {

      .project-modal {
        padding: 35px 25px;
      }

      .project-modal-layout {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .project-modal-image {
        max-width: 280px;
      }

      .project-modal-text h3 {
        font-size: 20px;
      }

      .project-modal-text p {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>

  <!-- Navigation Bar -->
  <header>

    <a href="index.html" class="logo">
      Tianyi's Portfolio
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a href="resume.html">Resume</a>
      <a href="experience.html">Experience</a>
      <a href="projects.html" class="active">Projects</a>
      <a href="honors.html">UMich Honors Program</a>
      <a href="contact.html">Contact</a>
    </nav>

  </header>


  <!-- Projects Section -->
  <main class="page-container">

    <h1>My Projects</h1>

    <div class="cards">


      <!-- =====================================
           PROJECT 1
      ====================================== -->

      <button
        class="card project-card"
        type="button"
        data-project="combustion"
        aria-haspopup="dialog"
      >

        <span class="project-title">
          ME 350 Four-Bar Linkage System
        </span>

        <span class="project-summary">
        Designed a four-bar linkage system with a flashlight
        attached to the end coupler controlled by motor to
        shine flashlight on multiple photodiode target, with precision,
        The system included a full automated control system powered by
        Arduino
        </span>

      </button>



      <!-- =====================================
           PROJECT 2
      ====================================== -->

      <button
        class="card project-card"
        type="button"
        data-project="photodiode"
        aria-haspopup="dialog"
      >

        <span class="project-title">
          Smart Watch
        </span>

        <span class="project-summary">
          Designed and built a smart watch
          from PCB to soldering, then finally
          coding it to operate. Used standard Lithium
          drone battery and touch screen smart watch
          display, along with 2 prong magnetic charging.
        </span>

      </button>



      <!-- =====================================
           PROJECT 3
      ====================================== -->

      <button
        class="card project-card"
        type="button"
        data-project="newproject"
        aria-haspopup="dialog"
      >

        <span class="project-title">
          PCB Keychains
        </span>

        <span class="project-summary">
          Made a working Microcontroller keychian using
          STM32F4 as the MCU, with all the GPIO pins connected
          to pin header slots. (PCB printed unsoldered)
        </span>

      </button>



      <!-- =====================================
           PROJECT 4
      ====================================== -->

      <button
        class="card project-card"
        type="button"
        data-project="future"
        aria-haspopup="dialog"
      >

        <span class="project-title">
          ME 250 RMP Robot
        </span>

        <span class="project-summary">
          Designed a robot vehicle with a virtual four-bar claw 
          system installed on the vehicle, capable of picking up
          objects from the ground, while the claw maintained horizontal 
          position through the whole grab and lift motion. 
        </span>

      </button>


    </div>

  </main>



  <!-- =========================================
       PROJECT POPUP
  ========================================= -->

  <dialog
    class="experience-modal project-modal"
    id="project-modal"
    aria-labelledby="project-modal-title"
  >

    <!-- Close Button -->
    <button
      class="modal-close"
      type="button"
      aria-label="Close project details"
    >
      &times;
    </button>


    <!-- Project Title -->
    <h2 id="project-modal-title"></h2>


    <!-- Text Left / Image Right -->
    <div class="project-modal-layout">


      <!-- LEFT SIDE -->
      <div class="project-modal-text">

        <h3>Project Overview</h3>

        <p id="project-modal-description"></p>


        <h3>Additional Details</h3>

        <p id="project-modal-extra"></p>

      </div>



      <!-- RIGHT SIDE -->
      <div class="project-modal-image">

        <!-- Project Image -->
        <img
          id="project-modal-image"
          alt="Project Image"
          hidden
        >

        <!-- Placeholder -->
        <span
          id="project-image-placeholder"
          class="project-image-placeholder"
        >
          Add Project Photo
        </span>

      </div>


    </div>

  </dialog>



  <!-- =========================================
       PROJECT POPUP JAVASCRIPT
  ========================================= -->

  <script>

    // Information for Each Project
    const projects = {


      // ======================================
      // PROJECT 1: FOUR-BAR LINKAGE SYSTEM
      // ======================================

      combustion: {

        title: "ME 350 Four-Bar Linkage System",

        description:
          "Research and development of micro-combustion systems for insect-scale robotic applications.",

        extra: `
Exploring fuel generation, fuel delivery,
and combustion-based actuation for
miniature robotic systems.

Additional design information, prototype
images, and testing results can be added here.
`,

        // Project Image Filename
        image: "ME 350 Four-Bar Linkage System.jpg"

      },



      // ======================================
      // PROJECT 2: SMART WATCH
      // ======================================

      photodiode: {

        title: "Smart Watch",

        description:
          "Development of photodiode-based sensing circuits for optical measurements in combustion research.",

        extra: `
Developing electronic sensing systems
that convert photodiode current into
measurable voltage signals.

Circuit diagrams, hardware photographs,
and experimental results can be added here.
`,

        // Project Image Filename
        image: "Smart Watch.jpg"

      },



      // ======================================
      // PROJECT 3: PCB KEYCHAINS
      // ======================================

      newproject: {

        title: "PCB Keychains",

        description:
          "Write a short overview of your new engineering project here.",

        extra: `
Write your project details here.

You can describe the engineering problem,
design process, and software used.

You can also discuss the technical challenges,
solutions, and final results.

Add additional paragraphs as needed.
`,

        // Project Image Filename
        image: "PCB Keychains.jpg"

      },



      // ======================================
      // PROJECT 4: FUTURE PROJECTS
      // ======================================

      future: {

        title: "Future Projects",

        description:
          "More engineering and research projects coming soon.",

        extra:
          "Additional mechanical engineering, robotics, and electronics projects will be featured here.",

        // Project Image Filename
        image: "Future Projects.jpg"

      }

    };



    // ======================================
    // FIND POPUP ELEMENTS
    // ======================================

    const projectModal =
      document.getElementById("project-modal");

    const projectImage =
      document.getElementById("project-modal-image");

    const imagePlaceholder =
      document.getElementById("project-image-placeholder");



    // ======================================
    // IMAGE LOADING
    // ======================================

    // Show Image When Loaded
    projectImage.addEventListener("load", () => {

      projectImage.hidden = false;

      imagePlaceholder.hidden = true;

    });


    // Show Placeholder If Image Is Missing
    projectImage.addEventListener("error", () => {

      projectImage.hidden = true;

      imagePlaceholder.hidden = false;

    });



    // ======================================
    // OPEN PROJECT POPUP
    // ======================================

    document.querySelectorAll(".project-card").forEach(card => {

      card.addEventListener("click", () => {

        const project =
          projects[card.dataset.project];

        if (!project) return;


        // Set Project Title
        document.getElementById(
          "project-modal-title"
        ).textContent = project.title;


        // Set Project Description
        document.getElementById(
          "project-modal-description"
        ).textContent = project.description;


        // Set Additional Details
        document.getElementById(
          "project-modal-extra"
        ).textContent = project.extra;


        // Reset Image
        projectImage.hidden = true;

        imagePlaceholder.hidden = false;


        // Set the Image for This Project
        projectImage.src = project.image;

        projectImage.alt = project.title;


        // Open Popup With Zoom Animation
        projectModal.showModal();

      });

    });



    // ======================================
    // CLOSE POPUP USING X BUTTON
    // ======================================

    projectModal.querySelector(".modal-close")
      .addEventListener("click", () => {

        projectModal.close();

      });



    // ======================================
    // CLOSE POPUP BY CLICKING OUTSIDE
    // ======================================

    projectModal.addEventListener("click", event => {

      const rect =
        projectModal.getBoundingClientRect();

      const clickedOutside =
        event.clientX < rect.left ||
        event.clientX > rect.right ||
        event.clientY < rect.top ||
        event.clientY > rect.bottom;

      if (clickedOutside) {

        projectModal.close();

      }

    });


  </script>



  <!-- Smooth Page Transition -->
  <script src="transition.js"></script>

</body>
</html>
