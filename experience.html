
<section class="experience-section" id="experience">
  <h2>My Experience</h2>

  <div class="experience-list">

    <!-- Walter E. Lay Laboratory -->
    <button class="experience-card" type="button" data-experience="lay">
      <div class="experience-card-text">
        <h3>Walter E. Lay Automotive Laboratory</h3>
        <p class="experience-date">Add your dates here</p>
      </div>

      <div class="experience-photo">
        <span>Add Photo</span>
      </div>
    </button>

    <!-- Zoetic Robotics Laboratory -->
    <button class="experience-card" type="button" data-experience="zoetic">
      <div class="experience-card-text">
        <h3>Zoetic Robotics Laboratory</h3>
        <p class="experience-date">Add your dates here</p>
      </div>

      <div class="experience-photo">
        <span>Add Photo</span>
      </div>
    </button>

  </div>
</section>

<!-- Expanded popup -->
<dialog class="experience-modal" id="experience-modal">
  <button class="modal-close" type="button" aria-label="Close">×</button>

  <h2 id="modal-title"></h2>
  <p id="modal-date" class="modal-date"></p>
  <h3 id="modal-role"></h3>
  <p id="modal-university"></p>
  <p id="modal-description"></p>
</dialog>
