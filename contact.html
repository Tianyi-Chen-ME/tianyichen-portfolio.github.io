
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Contact | Troy Chen</title>

  <link rel="stylesheet" href="style.css?v=11">

  <!-- Social Media Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

  <!-- Navigation Bar -->
  <header>
    <a href="index.html" class="logo">
      Tianyi's Portfolio
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a href="resume.html">Resume</a>
      <a href="experience.html">Experience</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>


  <!-- Contact Page -->
  <main class="page-container contact-page">

    <h1>Contact Me</h1>

    <div class="content-box contact-form-box">

      <h2>Let's Connect!</h2>

      <p>
        I'm always interested in discussing engineering,
        robotics, research opportunities, and potential
        collaborations. Feel free to send me a message!
      </p>

      <!-- Contact Form -->
      <!-- REPLACE YOUR_EMAIL@example.com -->
      <form
        action="https://formsubmit.co/chentroy@umich.edu"
        method="POST"
        class="contact-form"
      >

        <!-- Email Settings -->
        <input
          type="hidden"
          name="_subject"
          value="New Message From My Portfolio!"
        >

        <input
          type="hidden"
          name="_template"
          value="table"
        >

        <!-- Anti-Spam -->
        <input
          type="text"
          name="_honey"
          style="display:none"
          tabindex="-1"
          autocomplete="off"
        >


        <!-- Name -->
        <div class="form-group">

          <label for="contact-name">
            Full Name
          </label>

          <input
            type="text"
            id="contact-name"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >

        </div>


        <!-- Company -->
        <div class="form-group">

          <label for="contact-company">
            Company / Organization
          </label>

          <input
            type="text"
            id="contact-company"
            name="company"
            placeholder="Enter your company (optional)"
            autocomplete="organization"
          >

        </div>


        <!-- Email -->
        <div class="form-group">

          <label for="contact-email">
            Email Address
          </label>

          <input
            type="email"
            id="contact-email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- Message -->
        <div class="form-group">

          <label for="contact-message">
            Your Message
          </label>

          <textarea
            id="contact-message"
            name="message"
            rows="6"
            placeholder="Write your message here..."
            required
          ></textarea>

        </div>


        <!-- Send Button -->
        <button
          type="submit"
          class="contact-submit-btn"
        >
          <i class="bi bi-send"></i>
          Send Message
        </button>

      </form>

    </div>


    <!-- Social Media Links -->
    <div class="content-box">

      <h2>Find Me Online</h2>

      <div class="social-links">

        <!-- LinkedIn -->
        <a
          href="https://www.linkedin.com/in/YOUR-LINKEDIN/"
          target="_blank"
          rel="noopener noreferrer"
          class="social-btn"
        >
          <i class="bi bi-linkedin"></i>
          LinkedIn
        </a>

        <!-- GitHub -->
        <a
          href="https://github.com/Tianyi-Chen-ME"
          target="_blank"
          rel="noopener noreferrer"
          class="social-btn"
        >
          <i class="bi bi-github"></i>
          GitHub
        </a>

        <!-- Instagram -->
        <a
          href="https://www.instagram.com/YOUR_USERNAME/"
          target="_blank"
          rel="noopener noreferrer"
          class="social-btn"
        >
          <i class="bi bi-instagram"></i>
          Instagram
        </a>

      </div>

    </div>

  </main>


  <!-- Smooth Page Transition -->
  <script src="transition.js"></script>

</body>
</html>
